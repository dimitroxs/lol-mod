<div class="container">
  <header>
    <h1>LoL Mods by DIMI</h1>
  <p>my collection of mods for league of legends</p>
  </header>
  <div class="mods-grid">
@for (mod of mods; track mod.name) {
  <app-mod-card
    [name]="mod.name"
    [description]="mod.description"
    [image]="mod.image"
    [tag]="mod.tag"
  />
}
  </div>
</div>
